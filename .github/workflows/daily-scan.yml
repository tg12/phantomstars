name: Daily Phantom Stars Scan

concurrency:
  group: phantomstars-scan-${{ github.ref }}
  cancel-in-progress: false

on:
  schedule:
    # GitHub Actions cron is UTC-only. Trigger at both 06:00 and 07:00 UTC,
    # then use the active London UTC offset to select the correct one for 07:00 local time.
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: "Enable debug logging"
        type: boolean
        default: false
      target_repo:
        description: "Optional one-off target repo in owner/repo form"
        type: string
        required: false
      request_depth:
        description: "One-off request depth"
        type: choice
        required: false
        default: recent
        options:
          - recent
          - lifetime-request

permissions:
  contents: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Check London run window
        id: schedule_gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "london_offset=manual" >> "${GITHUB_OUTPUT}"
            echo "should_run=true" >> "${GITHUB_OUTPUT}"
            echo "Proceeding with non-scheduled run."
            exit 0
          fi

          london_offset=$(TZ=Europe/London date +%z)
          scheduled_cron="${{ github.event.schedule }}"
          should_run=false

          if [ "${london_offset}" = "+0100" ] && [ "${scheduled_cron}" = "0 6 * * *" ]; then
            should_run=true
          elif [ "${london_offset}" = "+0000" ] && [ "${scheduled_cron}" = "0 7 * * *" ]; then
            should_run=true
          fi

          echo "london_offset=${london_offset}" >> "${GITHUB_OUTPUT}"
          echo "should_run=${should_run}" >> "${GITHUB_OUTPUT}"

          if [ "${should_run}" != "true" ]; then
            echo "Skipping scheduled run outside 07:00 Europe/London."
            exit 0
          fi

          echo "Proceeding with 07:00 Europe/London run via ${scheduled_cron}."

      - name: Stop early outside London run window
        if: github.event_name == 'schedule' && steps.schedule_gate.outputs.should_run != 'true'
        run: exit 0

      - name: Set up Python 3.13
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Install dependencies
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.should_run == 'true'
        run: pip install -e .

      - name: Validate one-off request inputs
        if: github.event_name == 'workflow_dispatch' && inputs.target_repo != ''
        run: |
          case "${{ inputs.target_repo }}" in
            */*) ;;
            *)
              echo "target_repo must be in owner/repo form"
              exit 1
              ;;
          esac
          if [ "${{ inputs.request_depth }}" = "lifetime-request" ]; then
            echo "Lifetime request recorded for ${{ inputs.target_repo }}."
            echo "Executing lifetime targeted scan for ${{ inputs.target_repo }}."
            echo "This path is for one-off requests only and is not used by the daily scheduled scan."
          fi

      - name: Run scan
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PHANTOMSTARS_TARGET_REPO: ${{ inputs.target_repo }}
          PHANTOMSTARS_REQUEST_DEPTH: ${{ inputs.request_depth }}
        run: python -m phantomstars.main

      - name: Commit results
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.should_run == 'true'
        run: |
          git config user.name "phantomstars[bot]"
          git config user.email "phantomstars[bot]@users.noreply.github.com"
          git add data/ README.md
          git diff --staged --quiet || (
            git commit -m "scan: $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push origin main
          )
